<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelSafe Phase 2 - IoT Hardware & Turnstile Connected Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #050811;
      --bg-surface: #0a101d;
      --bg-card: #0f182c;
      --bg-card-hover: #15223e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent-primary: #3b82f6;
      --accent-secondary: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Master Top Bar */
    .master-header {
      background: rgba(10, 16, 29, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
    }

    .brand-text h1 {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
    }

    .phase-toggle-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 2px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .phase-toggle-btn {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .phase-toggle-btn.active {
      background: #f59e0b;
      color: #fff;
    }

    .phase-toggle-btn:hover:not(.active) { color: #fff; }

    /* Role Nav Bar */
    .role-nav-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .role-btn {
      padding: 5px 12px;
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-btn.active {
      background: var(--bg-card);
      color: #fff;
      border: 1px solid var(--border-strong);
    }

    /* Sub Context Bar */
    .saas-bar {
      background: #080d19;
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.72rem;
    }

    .saas-pill {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      font-size: 0.65rem;
      font-weight: 700;
    }

    /* Main Container */
    .app-main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ui-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .ui-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ui-card-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      padding: 7px 14px;
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-warning { background: #f59e0b; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .btn-sm { padding: 4px 8px; font-size: 0.68rem; }

    /* Physical Turnstile Graphic Simulator */
    .turnstile-visualizer {
      background: #070c17;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .turnstile-barrier {
      width: 220px;
      height: 80px;
      background: #111a2f;
      border: 2px solid #ef4444;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
    }

    .turnstile-barrier.unlocked {
      border-color: #10b981;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.4);
      background: #092018;
    }

    .barrier-wing {
      width: 40px;
      height: 60px;
      background: #ef4444;
      border-radius: 4px;
      transition: transform 0.4s ease;
    }

    .turnstile-barrier.unlocked .barrier-wing.left {
      transform: rotate(-55deg) translate(-10px, -5px);
      background: #10b981;
    }

    .turnstile-barrier.unlocked .barrier-wing.right {
      transform: rotate(55deg) translate(10px, -5px);
      background: #10b981;
    }

    /* Biometric Sensor Pad */
    .bio-sensor-plate {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(10, 16, 29, 0.9) 70%);
      border: 2px dashed #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      margin: 10px auto;
      transition: all 0.3s;
    }

    .bio-sensor-plate:hover {
      transform: scale(1.05);
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }

    .bio-scanline {
      position: absolute;
      width: 80%;
      height: 2px;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: bioSweep 1.8s ease-in-out infinite;
    }

    @keyframes bioSweep {
      0% { top: 20%; opacity: 0.2; }
      50% { top: 80%; opacity: 1; }
      100% { top: 20%; opacity: 0.2; }
    }

    /* Hardware Telemetry Bar */
    .hardware-health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .hw-node {
      background: #090e1c;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Form Styles */
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
    .form-input, .form-select {
      background: #090f1f;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 7px 10px;
      font-size: 0.76rem;
      font-family: inherit;
      outline: none;
    }

    /* Pricing Grid */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .plan-card {
      background: #0c1424;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .plan-card.active { border-color: #f59e0b; box-shadow: 0 0 16px rgba(245, 158, 11, 0.25); }
    .plan-price { font-size: 1.4rem; font-weight: 800; color: #fff; }

    /* Toast Notification */
    #toastTray {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast-msg {
      background: #1e293b;
      border: 1px solid #f59e0b;
      color: #fff;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.76rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- Top System Header -->
  <header class="master-header">
    <div class="brand-section">
      <div class="brand-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="brand-text">
        <h1>HostelSafe <span class="phase-badge">Phase 2: IoT Hardware Connected</span></h1>
      </div>
    </div>

    <!-- Phase Selector Switch -->
    <div class="phase-toggle-box">
      <a href="phase1.html" class="phase-toggle-btn" title="Pure Software Mode (No Devices)">
        📱 Phase 1 (App Only)
      </a>
      <button class="phase-toggle-btn active" title="Hardware Turnstiles & IoT Mode">
        ⚡ Phase 2 (IoT Devices)
      </button>
      <a href="index.html" class="phase-toggle-btn" title="Master Full Suite">
        ★ Full Suite
      </a>
    </div>

    <!-- Persona Switcher -->
    <div class="role-nav-group">
      <button class="role-btn active" onclick="switchView('kiosk')">Turnstile Kiosk Terminal</button>
      <button class="role-btn" onclick="switchView('devices')">IoT Hardware Manager</button>
      <button class="role-btn" onclick="switchView('admin')">Hardware SaaS Plans</button>
    </div>
  </header>

  <!-- Sub Context Bar -->
  <div class="saas-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="saas-pill">PHYSICAL HARDWARE SUITE</span>
      <span style="color:var(--text-muted);">Station: <strong>Gate 1 Main Motorized Turnstile (North Perimeter)</strong></span>
      <span style="color:var(--text-dim);">•</span>
      <span>Sensor: <strong>Mantra MFS100 USB OTG (Connected)</strong></span>
      <span style="color:var(--text-dim);">•</span>
      <span style="color:#10b981;">● Relay Controller Online (TCP 192.168.1.101)</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="color:#34d399; font-weight:700;">Phase 2 MRR: ₹47,998/mo</span>
      <button class="btn btn-secondary btn-sm" onclick="switchView('admin')">Enterprise Plans</button>
    </div>
  </div>

  <!-- Main View Container -->
  <main class="app-main" id="viewContainer">
    <!-- Populated by JavaScript -->
  </main>

  <div id="toastTray"></div>

  <script>
    const phase2Data = {
      turnstileUnlocked: false,
      hardwareNodes: [
        { name: "Turnstile Flap Barrier 1A", ip: "192.168.1.101", status: "ONLINE", type: "Motorized Flap Barrier (COM 3 Relay)" },
        { name: "USB Biometric Sensor", ip: "USB-BUS-04", status: "READY", type: "Mantra MFS100 Optical (500 DPI)" },
        { name: "RTSP CCTV Snapshot Cam", ip: "192.168.1.145", status: "STREAMING", type: "1080p Dome RTSP (Gate 1 Overhead)" },
        { name: "Edge Fail-Safe Controller", ip: "192.168.1.100", status: "SYNCED", type: "Embedded Linux Daemon (Offline Queue: 0)" }
      ],
      logs: [
        { time: "16:15", name: "Rohit Verma", room: "B-108", type: "CHECK_OUT", method: "Mantra MFS100 Fingerprint", details: "Template FP_ROHIT_018 matched. 500ms Relay pulse fired. Barrier opened." },
        { time: "14:05", name: "Kabir Sen", room: "B-402", type: "CHECK_OUT", method: "Mantra MFS100 Fingerprint", details: "Template FP_KABIR_105 matched. Turnstile flap unlocked." }
      ]
    };

    let currentView = "kiosk";

    function showToast(msg) {
      const tray = document.getElementById("toastTray");
      const div = document.createElement("div");
      div.className = "toast-msg";
      div.innerText = msg;
      tray.appendChild(div);
      setTimeout(() => div.remove(), 3500);
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll(".role-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", ["kiosk", "devices", "admin"][idx] === view);
      });
      render();
    }

    function triggerBiometricBarrierRelease() {
      const studentSelect = document.getElementById("simResidentSelect");
      const residentName = studentSelect ? studentSelect.value : "Aarav Sharma";

      showToast(`Biometric Minutiae Captured! Verifying gate pass for ${residentName}...`);

      setTimeout(() => {
        phase2Data.turnstileUnlocked = true;
        render();

        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        phase2Data.logs.unshift({
          time: now,
          name: residentName,
          room: "B-204",
          type: "CHECK_OUT",
          method: "Mantra MFS100 USB Biometric",
          details: `Minutiae verified (Score: 98.4%). Flap barrier relay COM 3 released. RTSP camera snapshot archived.`
        });

        showToast(`BARRIER RELEASED: Motorized Turnstile Unlocked for ${residentName}!`);

        // Auto close after 4 seconds
        setTimeout(() => {
          phase2Data.turnstileUnlocked = false;
          render();
          showToast("Barrier cycle complete. Turnstile locked.");
        }, 3800);
      }, 700);
    }

    function render() {
      const container = document.getElementById("viewContainer");
      if (!container) return;

      if (currentView === "kiosk") {
        container.innerHTML = `
          <!-- Physical Turnstile & Biometric Sensor Console -->
          <div style="display:grid; grid-template-columns: 1fr 1.2fr; gap:16px;">
            <div class="ui-card">
              <div class="ui-card-header">
                <div class="ui-card-title">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 2a10 10 0 0 0-8 6.2c-.3.7 0 1.5.7 1.8.7.3 1.5 0 1.8-.7A8 8 0 0 1 12 4a8 8 0 0 1 5.5 2.3c.6.5 1.5.5 2-.1.5-.6.5-1.5-.1-2A10 10 0 0 0 12 2z"/></svg>
                  Physical Hardware Gate Station
                </div>
                <span class="status-pill ${phase2Data.turnstileUnlocked ? 'status-inside' : 'status-overdue'}">
                  ${phase2Data.turnstileUnlocked ? 'BARRIER OPEN' : 'BARRIER LOCKED'}
                </span>
              </div>

              <!-- Physical Turnstile Visualizer -->
              <div class="turnstile-visualizer">
                <div style="font-size:0.7rem; font-weight:700; color:var(--text-muted);">
                  MOTORIZED FLAP BARRIER 1A STATUS:
                </div>
                <div class="turnstile-barrier ${phase2Data.turnstileUnlocked ? 'unlocked' : ''}">
                  <div class="barrier-wing left"></div>
                  <div style="font-weight:800; font-size:0.75rem; color:${phase2Data.turnstileUnlocked?'#34d399':'#ef4444'}; text-align:center;">
                    ${phase2Data.turnstileUnlocked ? 'RELAY ACTIVE (PASS)' : 'SECURE LOCKED'}
                  </div>
                  <div class="barrier-wing right"></div>
                </div>
                <div style="font-size:0.65rem; color:var(--text-dim);">
                  Relay Trigger: <code>COM3 -> GPIO_14 (500ms Pulse)</code>
                </div>
              </div>

              <!-- Biometric Touch Plate Simulator -->
              <div style="border-top:1px solid var(--border-subtle); padding-top:10px;">
                <div class="form-group" style="margin-bottom:8px;">
                  <label class="form-label">Simulate Fingerprint on Sensor Plate:</label>
                  <select id="simResidentSelect" class="form-select">
                    <option value="Aarav Sharma">Aarav Sharma (Room B-204 • CS2026-042)</option>
                    <option value="Rohit Verma">Rohit Verma (Room B-108 • ME2026-018)</option>
                    <option value="Priya Patel">Priya Patel (Room A-312 • EC2026-091)</option>
                  </select>
                </div>

                <div class="bio-sensor-plate" onclick="triggerBiometricBarrierRelease()" title="Touch fingerprint sensor to scan">
                  <div class="bio-scanline"></div>
                  <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8">
                    <path d="M12 2a10 10 0 0 0-8 6.2c-.3.7 0 1.5.7 1.8.7.3 1.5 0 1.8-.7A8 8 0 0 1 12 4a8 8 0 0 1 5.5 2.3c.6.5 1.5.5 2-.1.5-.6.5-1.5-.1-2A10 10 0 0 0 12 2z"/>
                    <path d="M7 11a5 5 0 0 1 10 0c0 1.7-.4 3.3-1.1 4.7-.4.7-.2 1.6.5 2 .7.4 1.6.2 2-.5A12 12 0 0 0 19 11a7 7 0 0 0-14 0c0 2.2.6 4.3 1.7 6.1.4.7 1.3.9 2 .5.7-.4.9-1.3.5-2A8 8 0 0 1 7 11z"/>
                    <path d="M12 8a3 3 0 0 0-3 3c0 2.5-.5 4.8-1.5 7-.3.7 0 1.5.7 1.8.7.3 1.5 0 1.8-.7 1.2-2.5 1.8-5.2 2-8.1A1 1 0 0 1 12 8z"/>
                  </svg>
                </div>

                <div style="text-align:center; font-size:0.7rem; color:var(--text-muted);">
                  TOUCH OPTICAL SENSOR TO SCAN (MANTRA MFS100 OTG)
                </div>
              </div>
            </div>

            <!-- Hardware Telemetry & Real-Time Passage Stream -->
            <div class="ui-card">
              <div class="ui-card-header">
                <div class="ui-card-title">IoT Hardware Telemetry &amp; CCTV Audit</div>
                <span class="status-pill status-inside">ALL GATES ONLINE</span>
              </div>

              <!-- Hardware Node Status -->
              <div class="hardware-health-grid">
                ${phase2Data.hardwareNodes.map(node => `
                  <div class="hw-node">
                    <div style="font-weight:700; color:#fff;">${node.name}</div>
                    <div style="color:#38bdf8; font-family:'JetBrains Mono', monospace; font-size:0.65rem;">${node.ip}</div>
                    <div style="font-size:0.62rem; color:var(--text-dim);">${node.type}</div>
                    <div style="color:#10b981; font-weight:700; margin-top:2px;">● ${node.status}</div>
                  </div>
                `).join('')}
              </div>

              <!-- Gate Logs -->
              <div style="margin-top:10px;">
                <div style="font-size:0.75rem; font-weight:700; color:#fff; margin-bottom:6px;">Barrier Release Logs:</div>
                <div style="display:flex; flex-direction:column; gap:8px;">
                  ${phase2Data.logs.map(l => `
                    <div style="background:#090f1f; border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:10px; font-size:0.72rem;">
                      <div style="display:flex; justify-content:space-between;">
                        <strong>[${l.time}] ${l.name} (${l.room})</strong>
                        <span class="status-pill status-approved" style="font-size:0.58rem;">RELAY SUCCESS</span>
                      </div>
                      <div style="color:var(--text-muted); font-size:0.68rem; margin-top:3px;">${l.details}</div>
                      <div style="color:var(--text-dim); font-size:0.65rem;">Hardware Device: ${l.method}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (currentView === "devices") {
        container.innerHTML = `
          <!-- IoT Hardware Device Configurator -->
          <div class="ui-card">
            <div class="ui-card-header">
              <div class="ui-card-title">Perimeter Gate Hardware &amp; Relay Controllers</div>
              <button class="btn btn-primary btn-sm" onclick="showToast('Searching LAN for new turnstile controllers via mDNS...');">+ Discover Gate Relay</button>
            </div>

            <div style="display:flex; flex-direction:column; gap:10px;">
              ${phase2Data.hardwareNodes.map(node => `
                <div style="background:#090f1f; border:1px solid var(--border-strong); border-radius:var(--radius-md); padding:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                  <div>
                    <div style="font-weight:800; font-size:0.85rem; color:#fff;">${node.name}</div>
                    <div style="font-size:0.7rem; color:var(--text-muted); font-family:'JetBrains Mono', monospace;">Network Endpoint: ${node.ip}</div>
