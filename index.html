<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelSafe - Complete Multi-Screen Gate & Resident Operations Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070b14;
      --bg-surface: #0e1526;
      --bg-card: #131d33;
      --bg-card-hover: #182542;
      --bg-input: #0a1120;
      --border-subtle: #1c273e;
      --border-focus: #3b82f6;
      --border-strong: #2a3b5c;

      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-border: rgba(16, 185, 129, 0.35);

      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --warning-border: rgba(245, 158, 11, 0.35);

      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.35);

      --info: #06b6d4;
      --info-bg: rgba(6, 182, 212, 0.12);
      --info-border: rgba(6, 182, 212, 0.35);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.55);
      --shadow-lg: 0 14px 32px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Master Top System Bar */
    .master-header {
      background: rgba(14, 21, 38, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.4);
    }

    .brand-text h1 {
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-text p {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .role-switcher-group {
      display: flex;
      background: #090e1a;
      border: 1px solid var(--border-subtle);
      padding: 3px;
      border-radius: var(--radius-md);
    }

    .role-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .role-nav-btn:hover {
      color: var(--text-main);
    }

    .role-nav-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    .header-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 11px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }

    .header-btn.cron-action {
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.08);
    }

    .header-btn.cron-action:hover {
      background: rgba(245, 158, 11, 0.16);
    }

    /* Screen Directory Quick Bar */
    .screen-directory-bar {
      background: #080d1a;
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .screen-dir-tag {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .screen-chip {
      background: #111a2e;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.15s;
    }

    .screen-chip:hover {
      color: #fff;
      border-color: var(--border-strong);
      background: #16223d;
    }

    .screen-chip.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent-primary);
      color: #60a5fa;
    }

    /* Viewport Architecture */
    .viewport-canvas {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 12px;
      position: relative;
    }

    .device-housing {
      width: 100%;
      background: #020612;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s ease;
    }

    .device-housing.mode-mobile {
      max-width: 440px;
      height: 850px;
      border: 8px solid #1c273e;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .device-housing.mode-tablet {
      max-width: 860px;
      min-height: 850px;
      border: 8px solid #1c273e;
      border-radius: 28px;
    }

    .device-housing.mode-fullscreen {
      max-width: 1220px;
      min-height: 820px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }

    .device-notch-bar {
      display: none;
      height: 22px;
      background: #000;
      justify-content: center;
      align-items: center;
    }

    .device-housing.mode-mobile .device-notch-bar {
      display: flex;
    }

    .device-notch {
      width: 90px;
      height: 10px;
      background: #1c273e;
      border-radius: 5px;
    }

    /* Main App Screen Shell */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      overflow-y: auto;
      position: relative;
    }

    /* In-App App Subheader */
    .screen-header {
      background: #0b1222;
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .screen-header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .screen-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .screen-subtitle {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* In-App Sub Tabs Bar */
    .app-sub-nav {
      display: flex;
      background: #070c18;
      border-bottom: 1px solid var(--border-subtle);
      overflow-x: auto;
    }

    .sub-nav-btn {
      flex: 1;
      min-width: fit-content;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .sub-nav-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.02);
    }

    .sub-nav-btn.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
      background: rgba(59, 130, 246, 0.05);
    }

    /* Badges & Status */
    .role-badge {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-resident { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.35); }
    .badge-warden { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-parent { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-admin { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }

    .status-pill {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .status-inside { background: var(--success-bg); color: #34d399; border: 1px solid var(--success-border); }
    .status-outside { background: var(--warning-bg); color: #fbbf24; border: 1px solid var(--warning-border); }
    .status-overdue { background: var(--danger-bg); color: #f87171; border: 1px solid var(--danger-border); animation: pulseDanger 2s infinite ease-in-out; }
    .status-approved { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.35); }
    .status-pending { background: rgba(148, 163, 184, 0.12); color: #94a3b8; border: 1px solid var(--border-strong); }
    .status-rejected { background: var(--danger-bg); color: #f87171; border: 1px solid var(--danger-border); }

    @keyframes pulseDanger {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { opacity: 0.85; box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    }

    /* Screen Body Content */
    .screen-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Cards */
    .ui-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .ui-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .ui-card-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ui-card-subtitle {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* Forms */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* Buttons */
    .btn {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn:hover { background: var(--accent-primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #1c273e; border: 1px solid var(--border-subtle); color: #cbd5e1; }
    .btn-secondary:hover { background: #253352; }
    .btn-outline { background: transparent; border: 1px solid var(--border-subtle); color: #cbd5e1; }
    .btn-outline:hover { background: #1c273e; border-color: var(--border-strong); }
    .btn-sm { padding: 5px 9px; font-size: 0.72rem; }
    .btn-block { width: 100%; }

    /* Biometric Kiosk Hardware Box */
    .kiosk-scanner-container {
      background: linear-gradient(180deg, #091224 0%, #030712 100%);
      border: 2px dashed #22334f;
      border-radius: var(--radius-lg);
      padding: 22px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .kiosk-scanner-container:hover {
      border-color: #38bdf8;
      background: linear-gradient(180deg, #0f1c36 0%, #050c1e 100%);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.15);
    }

    .kiosk-scanner-container.scanning {
      border-color: var(--accent-primary);
      animation: sensorPulse 1.2s infinite alternate;
    }

    .scanner-aperture {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(14, 21, 38, 0.8) 70%);
      border: 2px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    }

    .scanner-aperture svg {
      width: 42px;
      height: 42px;
      stroke: #38bdf8;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .kiosk-scanner-container.success .scanner-aperture {
      border-color: var(--success);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.5);
    }
    .kiosk-scanner-container.success .scanner-aperture svg { stroke: var(--success); }
    .kiosk-scanner-container.denied .scanner-aperture {
      border-color: var(--danger);
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.5);
    }
    .kiosk-scanner-container.denied .scanner-aperture svg { stroke: var(--danger); }

    @keyframes sensorPulse {
      0% { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
      100% { border-color: #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }
    }

    .scanner-scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #60a5fa, transparent);
      box-shadow: 0 0 8px #38bdf8;
      opacity: 0;
    }

    .kiosk-scanner-container.scanning .scanner-scanline {
      opacity: 1;
      animation: scanSweep 1.2s infinite ease-in-out;
    }

    @keyframes scanSweep {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-value {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .kpi-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Stepper */
    .stepper-timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      padding-left: 20px;
    }

    .stepper-timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border-strong);
    }

    .step-node {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.74rem;
    }

    .step-dot {
      position: absolute;
      left: -20px;
      top: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-node.completed .step-dot {
      background: var(--success);
      border-color: var(--success);
    }

    .step-node.active .step-dot {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      box-shadow: 0 0 8px var(--accent-primary);
    }

    /* Audit Stream */
    .audit-stream {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .audit-item {
      background: var(--bg-input);
      border-left: 3px solid var(--border-strong);
      padding: 8px 10px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.74rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .audit-item.check-out { border-left-color: var(--warning); }
    .audit-item.check-in { border-left-color: var(--success); }
    .audit-item.denied { border-left-color: var(--danger); }
    .audit-item.overdue { border-left-color: var(--danger); background: rgba(239, 68, 68, 0.05); }

    .audit-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
    }

    /* Modal Framework */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 20, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.show { display: flex; }

    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: var(--radius-sm);
    }
    .modal-close-btn:hover { background: var(--bg-card); color: #fff; }

    .modal-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 75vh;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-input);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Toast Tray */
    .toast-tray {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2000;
      pointer-events: none;
      max-width: 380px;
      width: 100%;
    }

    .toast-msg {
      background: #0f182c;
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--accent-primary);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.76rem;
      color: var(--text-main);
      pointer-events: auto;
      transform: translateX(120%);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast-msg.show { transform: translateX(0); opacity: 1; }
    .toast-msg.success { border-left-color: var(--success); }
    .toast-msg.warning { border-left-color: var(--warning); }
    .toast-msg.danger { border-left-color: var(--danger); }
    .toast-msg.info { border-left-color: var(--info); }

    .toast-icon { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

    /* SVG Icon Helpers */
    .icon {
      width: 16px;
      height: 16px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
      display: inline-block;
    }
    .icon-sm { width: 14px; height: 14px; }
    .icon-lg { width: 20px; height: 20px; }

    /* Receipt Slip */
    .receipt-slip {
      background: #ffffff;
      color: #0f172a;
      padding: 16px;
      border-radius: var(--radius-md);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #cbd5e1;
    }

    .receipt-slip .receipt-header {
      border-bottom: 2px dashed #94a3b8;
      padding-bottom: 8px;
      text-align: center;
    }

    .receipt-slip .receipt-row {
      display: flex;
      justify-content: space-between;
    }

    .receipt-slip .receipt-total {
      border-top: 2px dashed #94a3b8;
      padding-top: 8px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1c273e; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a3b5c; }

    /* =========================================================================
       AUTH, OTP & ONBOARDING STYLES
       ========================================================================= */
    .auth-banner {
      text-align: center;
      padding: 8px 4px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .auth-logo-shield {
      width: 46px;
      height: 46px;
      background: var(--accent-gradient);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(59, 130, 246, 0.45);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--bg-input);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      margin-bottom: 8px;
    }

    .auth-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .auth-tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }

    .auth-tab-btn.active {
      background: var(--bg-card);
      color: #60a5fa;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-strong);
    }

    .persona-quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .persona-card-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .persona-card-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .persona-card-name {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .persona-card-desc {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* OTP Code Inputs */
    .otp-inputs-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 14px 0;
    }

    .otp-digit-field {
      width: 44px;
      height: 52px;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      background: #080e1c;
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-md);
      color: #60a5fa;
      outline: none;
      transition: all 0.2s ease;
    }

    .otp-digit-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.45);
      background: #0d172e;
    }

    /* Biometric Simulation Pad */
    .bio-sensor-pad {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 8px auto;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.16) 0%, rgba(10, 17, 32, 0.85) 70%);
      border: 2px dashed #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      overflow: hidden;
    }

    .bio-sensor-pad.scanning {
      border-style: solid;
      border-color: #10b981;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.5);
    }

    .bio-scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8;
      animation: scanLaserAnim 1.6s infinite ease-in-out;
      display: none;
    }

    .bio-sensor-pad.scanning .bio-scan-laser {
      display: block;
    }

    @keyframes scanLaserAnim {
      0% { top: 12%; opacity: 0.2; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { top: 88%; opacity: 0.2; }
    }

    /* Onboarding Stepper */
    .onboarding-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 0 6px;
      margin-bottom: 14px;
    }

    .onboarding-stepper::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      height: 2px;
      background: var(--border-subtle);
      z-index: 1;
    }

    .stepper-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      transition: all 0.2s;

    .stepper-step.active .step-circle {
      background: var(--accent-primary);
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    .stepper-step.completed .step-circle {
      background: var(--success);
      border-color: #34d399;
      color: #fff;
    }

    .step-label {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stepper-step.active .step-label {
      color: #60a5fa;
    }

      background: #090f1e;
      border-bottom: 1px solid var(--border-subtle);

      flex-wrap: wrap;

      justify-content: space-between;
      gap: 10px;
      font-size: 0.74rem;
      position: sticky;
      top: 52px;
      z-index: 90;

    .saas-context-left, .saas-context-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .saas-tier-pill {
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(99, 102, 241, 0.16);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .saas-context-select {
      background: #0d1628;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .saas-context-select:focus {
      border-color: var(--accent-primary);
    }

    /* SaaS Subscription Plans Grid */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }

    .plan-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .plan-card:hover {
      border-color: var(--accent-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .plan-card.current {
      border-color: #3b82f6;
      background: linear-gradient(145deg, rgba(19, 29, 51, 0.95) 0%, rgba(30, 58, 138, 0.18) 100%);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
    }

    .plan-card.popular {
      border-color: #8b5cf6;
    }

    .plan-badge {
      position: absolute;
      top: -10px;
      right: 14px;
      background: var(--accent-gradient);
      color: #fff;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .plan-price {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      display: flex;
      align-items: baseline;
      gap: 2px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .plan-price-period {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .plan-feature-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 8px 0;
      line-height: 1.4;
    }

    .plan-feature-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .plan-feature-item svg {
      color: #10b981;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Multi-Ward Family Switcher */
    .multi-ward-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .ward-pill-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .ward-pill-card:hover {
      background: var(--bg-card-hover);
      border-color: #fbbf24;
    }

    .ward-pill-card.active {
      background: var(--bg-card);
      border-color: #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.25);
    }

    .ward-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .venue-chip-badge {
      display: inline-flex;

      gap: 4px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.28);
      color: #60a5fa;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.66rem;
      font-weight: 600;

    .city-pill {

      padding: 2px 7px;
      border-radius: var(--radius-full);

      font-weight: 600;
      cursor: pointer;

    .city-pill:hover {

    }

    .city-pill.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
    }

    .saas-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.72rem;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
  </style>
</head>

    let appState = null;

    function initAppState() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          appState = JSON.parse(stored);
        } else {
          appState = JSON.parse(JSON.stringify(DEFAULT_SEED_DATA));
          saveAppState();
        }
      } catch (e) {
        console.error("Reverting to default seed data:", e);
        appState = JSON.parse(JSON.stringify(DEFAULT_SEED_DATA));
      }
    }

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error("Storage error:", e);
      }
    }

    function confirmResetData() {
      showConfirmModal(
        "Reset System Data",
        "Restore all resident records, rooms, passes, complaints, and transactions to their initial demonstration seed state?",
        () => {
          localStorage.removeItem(STORAGE_KEY);
          initAppState();
          showToast("System data restored to initial demo state.", "info");
          render();
        }
      );
    }

    /* =========================================================================
       2. GLOBAL ROUTER & SCREEN REGISTRY
       ========================================================================= */

    let currentRole = "resident"; // resident, warden, parent, admin
    let currentScreen = "resident_dashboard"; // active screen ID

    let activeResidentUid = "stu_101";
    let activeParentUid = "par_201";
    let activeWardUid = "stu_101";

    /* =========================================================================
       1.5. SAAS MULTI-TENANT & SUBSCRIPTION CONTEXT ENGINE
       ========================================================================= */

    function getActiveTenant() {
      if (!appState || !appState.tenants) return null;
      return appState.tenants.find(t => t.id === appState.saas.activeTenantId) || appState.tenants[0];
    }

    function getActivePlan() {
      const tenant = getActiveTenant();
      if (!tenant || !appState.subscriptionPlans) return null;
      return appState.subscriptionPlans.find(p => p.id === tenant.planId) || appState.subscriptionPlans[1];
    }

    function getActiveVenue() {
      if (!appState || !appState.venues) return null;
      if (appState.saas.activeVenueId === "all") {
        const cityName = appState.saas.activeCityId === "all" ? "All Cities" : (appState.cities.find(c => c.id === appState.saas.activeCityId)?.name || "All Cities");
        return {
          id: "all",
          name: "All Properties & Hostels",
          cityName: cityName,
          code: "ALL"
        };
      }
      return appState.venues.find(v => v.id === appState.saas.activeVenueId) || appState.venues[0];
    }

    function switchTenant(tenantId) {
      if (!appState || !appState.saas) return;
      appState.saas.activeTenantId = tenantId;
      appState.saas.activeCityId = "all";
      appState.saas.activeVenueId = "all";
      saveAppState();
      const tenant = getActiveTenant();
      showToast(`Switched Tenant Context: ${tenant ? tenant.name : tenantId}`, "info");
      render();
    }

    function switchCity(cityId) {
      if (!appState || !appState.saas) return;
      appState.saas.activeCityId = cityId;
      if (cityId === "all") {
        appState.saas.activeVenueId = "all";
      } else {
        const cityVenues = appState.venues.filter(v => v.cityId === cityId);
        appState.saas.activeVenueId = cityVenues.length > 0 ? cityVenues[0].id : "all";
      }
      saveAppState();
      const cityObj = appState.cities.find(c => c.id === cityId);
      showToast(`Filtered City: ${cityObj ? cityObj.name : 'All Cities'}`, "info");
      render();
    }

    function switchVenue(venueId) {
      if (!appState || !appState.saas) return;
      appState.saas.activeVenueId = venueId;
      if (venueId !== "all") {
        const venue = appState.venues.find(v => v.id === venueId);
        if (venue) {
          appState.saas.activeCityId = venue.cityId;
        }
      }
      saveAppState();
      const v = getActiveVenue();
      showToast(`Selected Hostel: ${v ? v.name : venueId}`, "info");
      render();
    }

    function upgradeTenantPlan(tenantId, newPlanId) {
      const tenant = appState.tenants.find(t => t.id === tenantId) || getActiveTenant();
      const plan = appState.subscriptionPlans.find(p => p.id === newPlanId);
      if (!tenant || !plan) return;

      const planPrice = plan.priceInr || plan.pricePerMonth || 0;
      plan.priceInr = planPrice;
      tenant.planId = newPlanId;

      // Recalculate platform MRR

    function executeScheduledCurfewEngine(isAutomated = false) {
      const now = new Date();
      let overdueCount = 0;
      let evaluatedCount = 0;

      appState.passes.forEach(pass => {
        if (pass.state === "outside") {
          evaluatedCount++;
          const [expHour, expMin] = pass.returnExpectedTime.split(':').map(Number);
          const deadline = new Date(pass.returnExpectedDate || now.toISOString().split('T')[0]);
          deadline.setHours(expHour, expMin, 0, 0);

          const [depHour, depMin] = (pass.departureTime || "00:00").split(':').map(Number);
          if (depHour > expHour) {
            deadline.setDate(deadline.getDate() + 1);
          }

          if (now.getTime() > deadline.getTime()) {
            pass.state = "overdue";
            const student = appState.students.find(s => s.uid === pass.studentUid);
            if (student) student.status = "overdue";

            appState.gateLogs.unshift({
              id: "audit_" + Date.now(),
              timestamp: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              date: now.toLocaleDateString(),
              studentUid: pass.studentUid,
              studentName: pass.studentName,
              room: pass.room,
              type: "OVERDUE_MARKED",
              method: "Automated Curfew Scheduler",
              operator: "HostelSafe Daemon",
              passId: pass.id,
              details: `Curfew breached: Deadline was ${pass.returnExpectedTime}. Resident did not report at gate.`
            });

            if (student) {
              appState.notificationsOutbox.unshift({
                id: "notif_" + Date.now(),
                recipient: `${student.guardianName} & Warden`,
                phone: student.guardianPhone,
                title: "URGENT CURFEW BREACH",
                body: `ALERT: ${student.name} (${student.room}) missed return curfew (${pass.returnExpectedTime}). Please coordinate with Warden Office.`,
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                status: "DELIVERED_TO_DEVICE"
              });
            }
            overdueCount++;
          }
        }
      });

      saveAppState();
      render();

      if (overdueCount > 0) {
        showToast(`Curfew Audit: ${overdueCount} student(s) marked overdue! Alerts dispatched.`, "danger");
      } else if (!isAutomated) {
        showToast(`Curfew Audit: Evaluated ${evaluatedCount} outside pass(es). All within permitted limits.`, "success");
      }
    }

      let entered = "";
      for (let i = 0; i < 6; i++) {

      if (entered.length < 6 && entered !== authPendingOtp) {

    function adjustPassFormNotice(type) {
      const notice = document.getElementById("passPolicyNotice");
      const returnInput = document.getElementById("passReturnExpected");
      if (!notice) return;

      if (type === "day_out") {
        notice.innerHTML = "Policy: Day outing within city limits. Automatic SMS sent to parent; warden approval required. Curfew: 20:30.";
        if (returnInput) returnInput.value = "20:30";
      } else if (type === "late_night") {
        notice.innerHTML = "<strong style='color:#fbbf24;'>Policy Alert:</strong> Requires verified Parent Approval in Parent Portal BEFORE Warden can authorize. Curfew: 23:30.";
        if (returnInput) returnInput.value = "23:00";
      } else {
        notice.innerHTML = "<strong style='color:#fbbf24;'>Policy Alert:</strong> Requires parent approval, emergency travel itinerary, and warden sign-off.";
        if (returnInput) returnInput.value = "21:00";
      }
    }

    function handlePassSubmit(e, studentUid) {
      e.preventDefault();
      const student = appState.students.find(s => s.uid === studentUid);
      if (!student) return;

      const existingActive = appState.passes.find(p => p.studentUid === student.uid && ['draft', 'approved', 'outside', 'overdue'].includes(p.state));
      if (existingActive) {
        showToast("Access Denied: You already have an active pass in the system.", "danger");
        return;
      }

      const type = document.getElementById("passTypeSelect").value;
      const destination = document.getElementById("passDestinationInput").value.trim();
      const departureTime = document.getElementById("passDepartureTime").value;
      const returnExpectedTime = document.getElementById("passReturnExpected").value;
      const reason = document.getElementById("passReasonInput").value.trim();

      const newPass = {
        id: "pass_" + Date.now(),
        studentUid: student.uid,
        studentName: student.name,
        room: student.room,
        type: type,
        destination: destination,
        departureTime: departureTime,
        returnExpectedTime: returnExpectedTime,
        returnExpectedDate: new Date().toISOString().split('T')[0],
        reason: reason,
        parentConsent: (type === 'day_out' ? 'bypassed' : 'pending'),
        wardenStatus: 'pending',
        state: 'draft',
        appliedAt: new Date().toLocaleString([], { hour12: false })
      };

      appState.passes.push(newPass);

      appState.gateLogs.unshift({
        id: "log_" + Date.now(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: new Date().toLocaleDateString(),
        studentUid: student.uid,
        studentName: student.name,
        room: student.room,
        type: "PASS_APPLIED",
        method: "Resident Portal Submission",
        operator: student.name,
        passId: newPass.id,
        details: `Applied for ${type.replace('_',' ')} to ${destination}. Curfew: ${returnExpectedTime}.`
      });

      if (type !== 'day_out') {
        appState.notificationsOutbox.unshift({
          id: "notif_" + Date.now(),
          recipient: `${student.guardianName} (Parent)`,
          phone: student.guardianPhone,
          title: "Consent Required: Outing Request",
          body: `${student.name} requested a ${type.replace('_',' ')} pass to ${destination}. Action required in Parent Portal.`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: "DELIVERED_TO_DEVICE"
        });
      }

      saveAppState();
      showToast("Pass request registered successfully!", "success");
      navigateToScreen('resident_pass_tracker');
    }

    function cancelActivePass(passId) {
      showConfirmModal(
        "Cancel Gate Pass",
        "Are you sure you want to withdraw this outing application?",
        () => {
          const pass = appState.passes.find(p => p.id === passId);
          if (pass && pass.state === 'draft') {
            pass.state = 'cancelled';
            saveAppState();
            showToast("Pass request withdrawn.", "info");
            render();
          }
        }
      );
    }

    function triggerBiometricScanExecution() {
      const plate = document.getElementById("kioskSensorPlate");
      const selectedTarget = document.getElementById("kioskSimFingerprintSelect").value;
      if (!plate) return;

      plate.classList.remove("success", "denied");
      plate.classList.add("scanning");

      setTimeout(() => {
        plate.classList.remove("scanning");

        if (selectedTarget === "UNKNOWN_FINGERPRINT") {
          plate.classList.add("denied");
          showTerminalFeedback(
            "danger",
            "BIOMETRIC REJECTED: Unregistered Minutiae Template",
            "Presented fingerprint does not match any enrolled student. Barrier locked."
          );

          appState.gateLogs.unshift({
            id: "log_" + Date.now(),
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            date: new Date().toLocaleDateString(),
            studentUid: "UNKNOWN",
            studentName: "Unregistered Individual",
            room: "N/A",
            type: "ACCESS_DENIED",
            method: "Biometric Sensor Optical Fail",
            operator: "Gate 1 Autonomous Controller",
            passId: "NONE",
            details: "Unenrolled biometric template rejected. Access denied."
          });
          saveAppState();
          return;
        }

        const student = appState.students.find(s => s.uid === selectedTarget);
        if (student) processGateTransition(student, "Biometric Fingerprint (Mantra MFS100)");
      }, 700);
    }

    function processGateTransition(student, method, manualReason = "") {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const activePass = appState.passes.find(p => p.studentUid === student.uid && ['approved', 'outside', 'overdue'].includes(p.state));

      if (student.status === 'inside') {
        if (!activePass || activePass.state !== 'approved') {
          const plate = document.getElementById("kioskSensorPlate");
          if (plate) plate.classList.add("denied");

          showTerminalFeedback(
            "danger",
            `GATE EXIT DENIED: ${student.name} (${student.room})`,
            "No valid authorized pass found for this resident. Warden authorization required before exit."
          );

          appState.gateLogs.unshift({
            id: "log_" + Date.now(),
            timestamp: timeStr,
            date: now.toLocaleDateString(),
            studentUid: student.uid,
            studentName: student.name,
            room: student.room,
            type: "ACCESS_DENIED",
            method: method,
            operator: appState.meta.operator,
            passId: "NONE",
            details: "Unauthorized exit attempt without approved pass."
          });
          saveAppState();
          showToast(`Access Denied: ${student.name} has no approved exit pass.`, "danger");
          render();
          return;
        }

        student.status = 'outside';
        activePass.state = 'outside';

        const plate = document.getElementById("kioskSensorPlate");
        if (plate) plate.classList.add("success");

        showTerminalFeedback(
          "success",
          `CHECK-OUT AUTHORIZED: ${student.name} (${student.room})`,
          `Biometric confirmed. Destination: ${activePass.destination}. Curfew deadline: ${activePass.returnExpectedTime}. Gate barrier released.`
        );

        appState.gateLogs.unshift({
          id: "log_" + Date.now(),
          timestamp: timeStr,
          date: now.toLocaleDateString(),
          studentUid: student.uid,
          studentName: student.name,
          room: student.room,
          type: "CHECK_OUT",
          method: method,
          operator: appState.meta.operator,
          passId: activePass.id,
          details: `Authorized check-out recorded via ${method}. ${manualReason ? 'Override Reason: ' + manualReason : ''}`
        });

        appState.notificationsOutbox.unshift({
          id: "notif_" + Date.now(),
          recipient: `${student.guardianName} (Parent)`,
          phone: student.guardianPhone,
          title: "Hostel Gate Exit Recorded",
          body: `${student.name} checked out of ${appState.meta.hostelName} at ${timeStr}. Expected return: ${activePass.returnExpectedTime}.`,
          time: timeStr,
          status: "DELIVERED_TO_DEVICE"
        });

        saveAppState();
        showToast(`CHECK-OUT: ${student.name} exited gate safely.`, "success");
        render();
        return;
      }

      if (student.status === 'outside' || student.status === 'overdue') {
        const wasOverdue = student.status === 'overdue';
        student.status = 'inside';
        if (activePass) activePass.state = 'returned';

        const plate = document.getElementById("kioskSensorPlate");
        if (plate) plate.classList.add("success");

        showTerminalFeedback(
          "success",
          `CHECK-IN CONFIRMED: ${student.name} (${student.room})`,
          `Welcome back. Entry barrier released. Resident logged inside. ${wasOverdue ? 'Overdue flag cleared.' : ''}`
        );

        appState.gateLogs.unshift({
          id: "log_" + Date.now(),
          timestamp: timeStr,
          date: now.toLocaleDateString(),
          studentUid: student.uid,
          studentName: student.name,
          room: student.room,
          type: "CHECK_IN",
          method: method,
          operator: appState.meta.operator,
          passId: activePass ? activePass.id : "NONE",
          details: `Safely returned to hostel premises.`
        });

        appState.notificationsOutbox.unshift({
          id: "notif_" + Date.now(),
          recipient: `${student.guardianName} (Parent)`,
          phone: student.guardianPhone,
          title: "Safe Return Confirmed",
          body: `${student.name} returned to hostel and checked in at ${timeStr}.`,
          time: timeStr,
          status: "DELIVERED_TO_DEVICE"
        });

        saveAppState();
        showToast(`CHECK-IN: ${student.name} safely inside.`, "success");
        render();
      }
    }

    function showTerminalFeedback(type, title, desc) {
      const box = document.getElementById("kioskTerminalFeedbackBox");
      if (!box) return;
      box.style.display = "block";
      box.style.background = type === 'success' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)';
      box.style.border = `1px solid ${type === 'success' ? 'var(--success)' : 'var(--danger)'}`;
      box.style.color = type === 'success' ? '#6ee7b7' : '#fca5a5';
      box.innerHTML = `
        <div style="font-weight:800; font-size:0.84rem; margin-bottom:4px;">${escapeHtml(title)}</div>
        <div style="font-size:0.74rem;">${escapeHtml(desc)}</div>
      `;
    }

    function executeManualGateLookup() {
      const q = (document.getElementById("manualLookupInput").value || "").trim().toLowerCase();
      const container = document.getElementById("manualLookupResultContainer");
      if (!q) { showToast("Enter room or roll number.", "warning"); return; }

      const match = appState.students.find(s => s.room.toLowerCase() === q || s.rollNo.toLowerCase() === q || s.name.toLowerCase().includes(q));
      if (!match) {
        container.innerHTML = `<div style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:var(--radius-sm); padding:10px; font-size:0.75rem; color:#fca5a5; margin-top:8px;">No resident found matching "${escapeHtml(q)}".</div>`;
        return;
      }

      const activePass = appState.passes.find(p => p.studentUid === match.uid && ['approved', 'outside', 'overdue'].includes(p.state));

      container.innerHTML = `
        <div style="background:#0a1120; border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:12px; margin-top:8px; display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">

    function triggerManualWardenPassage(uid) {
      const student = appState.students.find(s => s.uid === uid);
      const reasonInput = document.getElementById("manualOverrideReason");
      const reason = reasonInput ? reasonInput.value.trim() : "";

      if (!reason) { showToast("Warden audit reason is required.", "warning"); return; }

      showConfirmModal(
        "Authorize Manual Gate Passage",
        `Confirm manual override for ${student.name} (${student.room})? This action is audited under Warden credentials.`,
        () => { processGateTransition(student, "Manual Warden Override", reason); }
      );
    }

    function wardenApprovePass(passId) {
      const pass = appState.passes.find(p => p.id === passId);
      if (!pass) return;

      if (pass.type !== 'day_out' && pass.parentConsent !== 'approved') {
        showToast("Policy Violation: Cannot approve late night pass without verified parent consent.", "danger");
        return;
      }

      pass.wardenStatus = 'approved';
      pass.state = 'approved';

      appState.gateLogs.unshift({
        id: "log_" + Date.now(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: new Date().toLocaleDateString(),
        studentUid: pass.studentUid,
        studentName: pass.studentName,
        room: pass.room,
        type: "PASS_AUTHORIZED",
        method: "Warden Kiosk Authorization",
        operator: appState.meta.operator,
        passId: pass.id,
        details: "Warden authorized pass. Barrier will unlock upon biometric scan."
      });

      saveAppState();
      showToast(`Pass authorized for ${pass.studentName}!`, "success");
      render();
    }

    function executeVerifiedPayment(studentUid, amount) {
      const student = appState.students.find(s => s.uid === studentUid);
      if (!student) return;

      const btn = document.getElementById("btnExecuteSandboxPay");
      const indicator = document.getElementById("paymentProcessingIndicator");
      const method = document.getElementById("paymentMethodSelect").value;

      if (btn) btn.disabled = true;
      if (indicator) indicator.style.display = "block";

      setTimeout(() => {
        student.rentStatus = 'paid';
        student.rentDue = 0;

        const txnId = "TXN_" + Math.floor(1000000 + Math.random() * 9000000);
        const receiptNo = `REC-2026-${student.room}-${Math.floor(100 + Math.random() * 900)}`;

        const txnRecord = {
          txnId: txnId,
          studentUid: student.uid,
          studentName: student.name,
          amount: amount,
          method: method,
          paidAt: new Date().toLocaleString([], { hour12: false }),
          status: "SUCCESS",
          receiptNo: receiptNo
        };
        appState.transactions.unshift(txnRecord);

        appState.gateLogs.unshift({
          id: "log_" + Date.now(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          date: new Date().toLocaleDateString(),
          studentUid: student.uid,
          studentName: student.name,
          room: student.room,
          type: "RENT_CLEARED",
          method: `Gateway Sandbox (${method})`,
          operator: "Payment Switch Integration",
          passId: "NONE",
          details: `Cleared rent dues of ₹${amount}. Txn ID: ${txnId}. Receipt: ${receiptNo}.`
        });

        appState.notificationsOutbox.unshift({
          id: "notif_" + Date.now(),
          recipient: `${student.guardianName} & ${student.name}`,
          phone: student.guardianPhone,
          title: "Payment Receipt: Dues Cleared",
          body: `Payment of ₹${amount} received successfully for ${student.name} (${student.room}). Receipt #${receiptNo}.`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: "DELIVERED_TO_DEVICE"
        });

        saveAppState();
        closeModal();
        showToast(`Payment of ₹${amount} verified & settled! Receipt issued.`, "success");
        render();
        viewPaymentReceipt(txnId);
      }, 850);
    }

    function showToast(message, type = "info") {
      const tray = document.getElementById("toastTray");
      if (!tray) return;

      const toast = document.createElement("div");
      toast.className = `toast-msg ${type}`;
      const iconSvg = type === 'success' ? '<svg class="toast-icon" viewBox="0 0 24 24" stroke="#10b981" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' :
                      type === 'danger'  ? '<svg class="toast-icon" viewBox="0 0 24 24" stroke="#ef4444" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' :
                      type === 'warning' ? '<svg class="toast-icon" viewBox="0 0 24 24" stroke="#f59e0b" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' :
                      '<svg class="toast-icon" viewBox="0 0 24 24" stroke="#3b82f6" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

      toast.innerHTML = `${iconSvg}<div style="flex:1;">${escapeHtml(message)}</div>`;
      tray.appendChild(toast);

      requestAnimationFrame(() => { toast.classList.add("show"); });
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 350);
      }, 3500);
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return str;
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener("DOMContentLoaded", () => {
      initAppState();
      render();
      setInterval(() => { executeScheduledCurfewEngine(true); }, 45000);
    });
  </script>
</body>
</html>
