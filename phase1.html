<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelSafe Phase 1 - Pure Software SaaS (Web Dashboards & Mobile Apps, Zero Hardware)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060a12;
      --bg-surface: #0c1220;
      --bg-card: #111a2e;
      --bg-card-hover: #18233c;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent-primary: #3b82f6;
      --accent-secondary: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
      --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Master Top Bar */
    .master-header {
      background: rgba(10, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    .brand-text h1 {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .phase-toggle-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 2px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .phase-toggle-btn {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .phase-toggle-btn.active {
      background: #10b981;
      color: #fff;
    }

    .phase-toggle-btn:hover:not(.active) {
      color: #fff;
    }

    /* Sub Navigation Bar for Dashboards and Apps */
    .role-nav-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .role-btn {
      padding: 5px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .role-btn.active {
      background: var(--bg-card);
      color: #fff;
      border: 1px solid var(--border-strong);
    }

    /* Context Banner */
    .saas-bar {
      background: #090f1e;
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.72rem;
    }

    .saas-pill {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      font-size: 0.65rem;
      font-weight: 700;
    }

    /* Main Container */
    .app-main {
      flex: 1;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ui-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .ui-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ui-card-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      padding: 7px 14px;
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-warning { background: #f59e0b; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .btn-sm { padding: 4px 8px; font-size: 0.68rem; }

    /* Phone Shell Simulator for Mobile App Views */
    .mobile-simulator-wrapper {
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    .mobile-phone-shell {
      width: 360px;
      background: #090f1f;
      border: 3px solid #1e293b;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .mobile-notch {
      width: 120px;
      height: 14px;
      background: #1e293b;
      border-radius: 0 0 10px 10px;
      margin: -16px auto 8px auto;
    }

    /* Dynamic QR Pass Container */
    .qr-container {
      background: #090f1f;
      border: 2px dashed rgba(59, 130, 246, 0.4);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .qr-box {
      width: 170px;
      height: 170px;
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
    }

    .qr-matrix-sim {
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(0deg, #0f172a, #0f172a 4px, #fff 4px, #fff 8px),
        repeating-linear-gradient(90deg, #0f172a, #0f172a 4px, #fff 4px, #fff 8px);
      background-blend-mode: difference;
      border-radius: 4px;
    }

    .timer-ring {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Warden Camera Simulator */
    .camera-kiosk {
      background: #050811;
      border: 2px solid #10b981;
      border-radius: var(--radius-md);
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .camera-scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #34d399, transparent);
      box-shadow: 0 0 12px #10b981;
      animation: scanAnim 2.2s infinite ease-in-out;
    }

    @keyframes scanAnim {
      0% { top: 10%; opacity: 0.2; }
      50% { top: 85%; opacity: 1; }
      100% { top: 10%; opacity: 0.2; }
    }

    .camera-target-reticle {
      width: 140px;
      height: 140px;
      border: 2px dashed rgba(16, 185, 129, 0.6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.72rem;
      color: #34d399;
      font-weight: 700;
      padding: 10px;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-input, .form-select {
      background: #080d1a;
      border: 1px solid var(--border-strong);
      color: #fff;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.78rem;
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    /* Audit Stream */
    .audit-item {
      background: #090f1f;
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent-primary);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.74rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-pill {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
    }

    .status-inside { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-outside { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-defaulter { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* In-App Notification Center */
    .notification-bubble {
      background: #091224;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .notification-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* Pricing Table */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .plan-card {
      background: #090f20;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .plan-card.active {
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
    }

    .plan-price {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    /* Modal for SMS OTP */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-card {
      background: #0d1629;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 420px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-lg);
    }

    .toast-tray {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
    }

    .toast-msg {
      background: #1e293b;
      border: 1px solid #3b82f6;
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Master Top Header -->
  <header class="master-header">
    <div class="brand-section">
      <div class="brand-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="brand-text">
        <h1>HostelSafe</h1>
      </div>
      <span class="phase-badge">Phase 1: Zero Hardware</span>
    </div>

    <!-- Phase Switcher Pills -->
    <div class="phase-toggle-box">
      <a href="phase1.html" class="phase-toggle-btn active">
        <span>📱</span> Phase 1: Pure Software (No Hardware)
      </a>
      <a href="phase2.html" class="phase-toggle-btn">
        <span>⚡</span> Phase 2: Hardware &amp; Turnstiles
      </a>
    </div>

    <!-- Interactive Navigation: Both Website Dashboard & Mobile App for Admin & Warden -->
    <div class="role-nav-group">
      <button class="role-btn active" onclick="switchView('admin_web')">
        <span>🖥️</span> Admin Web Dashboard
      </button>
      <button class="role-btn" onclick="switchView('admin_app')">
        <span>📱</span> Admin App
      </button>
      <button class="role-btn" onclick="switchView('warden_web')">
        <span>🖥️</span> Warden Web Desk
      </button>
      <button class="role-btn" onclick="switchView('warden_app')">
        <span>📱</span> Warden App
      </button>
      <button class="role-btn" onclick="switchView('resident')">
        <span>📱</span> Resident App
      </button>
      <button class="role-btn" onclick="switchView('parent')">
        <span>📱</span> Parent App
      </button>
      <button class="role-btn" onclick="switchView('pricing')">
        <span>💳</span> Pricing
      </button>
    </div>
  </header>

  <!-- SaaS Sub Context Bar -->
  <div class="saas-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="saas-pill">PHASE 1 SOFTWARE SUITE</span>
      <span style="color:var(--text-muted);">Tenant: <strong>Oxford &amp; Shivalik Student Housing</strong></span>
      <span style="color:var(--text-dim);">•</span>
      <span style="color:#34d399;">Active License: <strong>Campus Digital Pro</strong></span>
    </div>
    <div style="display:flex; align-items:center; gap:12px; font-size:0.72rem;">
      <span>Auth: <strong style="color:#38bdf8;">SMS OTP Only</strong></span>
      <span>Alerts: <strong style="color:#10b981;">Strictly In-App</strong></span>
      <span>Surfaces: <strong style="color:#fbbf24;">Web Dashboards + Mobile Apps</strong></span>
    </div>
  </div>

  <!-- Main View Container -->
  <main class="app-main" id="viewContainer">
    <!-- Populated dynamically via JS -->
  </main>

  <!-- Toast Notification Tray -->
  <div class="toast-tray" id="toastTray"></div>

  <!-- OTP Verification Modal Container -->
  <div id="otpModalContainer" style="display:none;"></div>

  <script>
    // In-Memory State for Phase 1 Demo
    const phase1Data = {
      property: "Shivalik North Campus (Delhi)",
      properties: ["Shivalik North Campus (Delhi)", "Aravalli Tech Park (Bengaluru)"],
      stats: {
        totalBeds: 300,
        occupied: 242,
        inside: 218,
        outside: 20,
        defaulters: 4,
        rentCollected: "₹18,40,000",
        rentPending: "₹1,60,000"
      },
      floorRounds: [
        { room: "B-101", student: "Sameer Joshi", status: "present", verifiedAt: "21:15" },
        { room: "B-102", student: "Arjun Nambiar", status: "present", verifiedAt: "21:16" },
        { room: "B-108", student: "Rohit Verma", status: "on_pass", verifiedAt: "Pass 902" },
        { room: "B-204", student: "Aarav Sharma", status: "present", verifiedAt: "21:20" },
        { room: "A-301", student: "Vikram Malhotra", status: "defaulter", verifiedAt: "Overdue" }
      ],
      residents: [
        { id: "stu_101", name: "Aarav Sharma", rollNo: "CS2026-042", room: "B-204", phone: "+91 98110 22311", status: "inside", curfew: "20:30", parentPhone: "+91 98110 99881", parentName: "Rajesh Sharma" },
        { id: "stu_102", name: "Rohit Verma", rollNo: "ME2026-118", room: "B-108", phone: "+91 98220 33411", status: "outside", curfew: "20:30", parentPhone: "+91 98220 88771", parentName: "Sanjay Verma" },
        { id: "stu_103", name: "Kabir Sen", rollNo: "CS2026-077", room: "B-402", phone: "+91 98330 44511", status: "outside", curfew: "20:30", parentPhone: "+91 98330 77661", parentName: "Anil Sen" },
        { id: "stu_104", name: "Vikram Malhotra", rollNo: "EC2026-015", room: "A-301", phone: "+91 98440 55611", status: "defaulter", curfew: "20:30", parentPhone: "+91 98440 66551", parentName: "Deepak Malhotra" },
        { id: "stu_105", name: "Pooja Hegde", rollNo: "BT2026-009", room: "W2-104", phone: "+91 98550 66711", status: "inside", curfew: "20:30", parentPhone: "+91 98550 55441", parentName: "Raghav Hegde" }
      ],
      pendingParentPasses: [
        {
          id: "pass_904",
          studentUid: "stu_106",
          studentName: "Ananya Sharma",
          city: "Bengaluru",
          hostel: "Aravalli Tech Park",
          type: "Weekend Leave",
          destination: "IISC Bengaluru Tech Symposium",
          returnExpected: "Tomorrow 20:00",
          status: "pending_parent"
        }
      ],
      inAppNotifications: [
        { id: "notif_1", time: "16:45", title: "Pass Endorsement Approved", body: "Guardian Rajesh Sharma approved Weekend Pass via SMS OTP.", target: "Resident Aarav Sharma" },
        { id: "notif_2", time: "16:15", title: "Gate Check-Out Logged", body: "Rohit Verma checked out via Warden WebCam QR Scanner.", target: "Parent Sanjay Verma" },
        { id: "notif_3", time: "15:30", title: "Curfew Defaulter Alert", body: "Vikram Malhotra exceeded evening curfew deadline (20:30).", target: "Warden Desk & Parent" }
      ],
      logs: [
        { time: "16:15", name: "Rohit Verma", room: "B-108", type: "CHECK_OUT", method: "WebCam QR Scanner (Zero Hardware)", note: "Pass pass_902 verified. Day Outing approved." },
        { time: "14:05", name: "Kabir Sen", room: "B-402", type: "CHECK_OUT", method: "Manual Roll Search (Warden Desk)", note: "Verified CS2026-077 via roster. Library pass." }
      ]
    };

    let currentView = "admin_web";
    let qrTimeLeft = 30;

    // Countdown ring for dynamic QR
    setInterval(() => {
      qrTimeLeft--;
      if (qrTimeLeft <= 0) qrTimeLeft = 30;
      const el = document.getElementById("qrCountdownVal");
      if (el) el.innerText = qrTimeLeft + "s";
    }, 1000);

    function showToast(msg) {
      const tray = document.getElementById("toastTray");
      const div = document.createElement("div");
      div.className = "toast-msg";
      div.innerText = msg;
      tray.appendChild(div);
      setTimeout(() => div.remove(), 3500);
    }

    function switchView(view) {
      currentView = view;
      const viewKeys = ["admin_web", "admin_app", "warden_web", "warden_app", "resident", "parent", "pricing"];
      document.querySelectorAll(".role-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", viewKeys[idx] === view);
      });
      render();
    }

    // Warden Manual Check-in / Check-out
    function handleManualCheck(type) {
      const input = document.getElementById("manualSearchInput");
      const val = (input ? input.value : "").trim().toLowerCase();
      if (!val) {
        showToast("Please enter student roll number or name.");
        return;
      }
      const student = phase1Data.residents.find(r => r.rollNo.toLowerCase().includes(val) || r.name.toLowerCase().includes(val));
      if (!student) {
        showToast("No resident found matching query.");
        return;
      }

      student.status = type === "out" ? "outside" : "inside";
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      phase1Data.logs.unshift({
        time: now,
        name: student.name,
        room: student.room,
        type: type === "out" ? "CHECK_OUT" : "CHECK_IN",
        method: "Manual Roster Check (Zero Hardware)",
        note: `Warden verified ${student.name} (${student.rollNo}) on Gate Desk.`
      });

      phase1Data.inAppNotifications.unshift({
        id: "notif_" + Date.now(),
        time: now,
        title: `Gate ${type === "out" ? "Exit" : "Entry"} Logged`,
        body: `${student.name} marked ${type === "out" ? "CHECKED OUT" : "CHECKED IN"} by Warden Desk.`,
        target: `Parent of ${student.name}`
      });

      showToast(`Success: ${student.name} marked ${type === "out" ? "CHECKED OUT" : "CHECKED IN"}!`);
      render();
    }
